schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: DoaFácil — plataforma de doações.
  Domain: Conecta doadores a pessoas ou instituições interessadas em itens doados
    (roupas, alimentos, móveis, livros, etc.), com categorias, localização,
    interesse, mensagens e avaliação.
  Tech stack: Backend em Xano (banco de dados, lógica de negócio, APIs).
    Frontend em Reflex (Python).
  Architecture: Backend responsável por regras de negócio, persistência e
    autorização. Frontend não deve ser considerado mecanismo de segurança.
  Frontend: Reflex é a tecnologia obrigatória para implementação das interfaces
    frontend do projeto. Não introduzir outra tecnologia de frontend sem uma
    mudança explícita da decisão arquitetural.
  Security: Regras de autorização devem ser aplicadas no backend (Xano). Dados
    de contato entre usuários não devem ser expostos publicamente.
  Development: O projeto será desenvolvido incrementalmente utilizando
    OpenSpec. Mudanças relevantes devem ser especificadas antes da
    implementação.
  Language: Escrever a documentação do projeto e os artefatos OpenSpec em
    português brasileiro.

# Per-artifact rules (optional)
rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo.
    - Identificar o que está fora do escopo quando necessário.
  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.
  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - Executar verificações relevantes antes de concluir.
  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.