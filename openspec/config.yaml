schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Project: DoaFácil.

  Domain: Plataforma web que conecta pessoas que querem doar objetos
  físicos a pessoas que precisam ou têm interesse nesses itens.
  Conceitos principais: Usuário, Doação, Categoria, Interesse,
  Mensagem, Localização e Avaliação. Não é plataforma de doações
  financeiras, de alimentos, nem marketplace de compra e venda.

  Tech stack:
    Frontend em Reflex (Python).
    Backend em Xano (XanoScript), com banco de dados e APIs.
    Git e GitHub para versionamento.

  Architecture:
    O backend (Xano) é responsável por regras de negócio, autenticação,
    persistência e APIs. O frontend (Reflex) consome as APIs do Xano e
    não acessa o banco diretamente. A pasta xano/ é a representação local
    do workspace e é sincronizada pelo Xano CLI.

  Security:
    Autorização e validação de dados são aplicadas no backend.
    O frontend não é mecanismo de segurança.
    Nunca versionar tokens, chaves ou senhas.

  Development:
    O projeto é desenvolvido incrementalmente com OpenSpec.
    Mudanças relevantes devem ser especificadas antes da implementação.
    Consultar docs/project-overview.md e docs/domain-model.md.
    Não presumir a sintaxe do XanoScript: consultar e validar com o
    Xano Developer MCP.

  Language:
    Escrever a documentação do projeto e os artefatos OpenSpec
    em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, o objetivo e o escopo.
    - Identificar o que está fora do escopo quando necessário.

  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

operations:
  apply:
    guidance:
      - Executar verificações relevantes antes de concluir cada tarefa.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.
